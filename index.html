<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FindMyJobs - Instant Job Access</title>
    <meta name="description" content="A paid-access job board with instant category unlocks, verified payments, and external application links for IT, Non-IT, and Banking careers." />


    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-31CDQ9E8XP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-31CDQ9E8XP');
    </script>

    <!-- ===== SEO ADDITIONS START ===== -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://findmyjobs.in/" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FindMyJobs" />
    <meta property="og:title" content="FindMyJobs - Instant Job Access" />
    <meta property="og:description" content="A paid-access job board with instant category unlocks, verified payments, and external application links for IT, Non-IT, and Banking careers." />
    <meta property="og:url" content="https://findmyjobs.in/" />
    <meta property="og:image" content="https://findmyjobs.in/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FindMyJobs - Instant Job Access" />
    <meta name="twitter:description" content="A paid-access job board with instant category unlocks, verified payments, and external application links for IT, Non-IT, and Banking careers." />
    <meta name="twitter:image" content="https://findmyjobs.in/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "FindMyJobs",
          "url": "https://findmyjobs.in/",
          "logo": "https://findmyjobs.in/apple-touch-icon.png"
        },
        {
          "@type": "WebSite",
          "name": "FindMyJobs",
          "url": "https://findmyjobs.in/"
        }
      ]
    }
    </script>

    <!-- Google Analytics 4: replace G-XXXXXXXXXX with your real Measurement ID (both places) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-31CDQ9E8XP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-31CDQ9E8XP');
    </script>
    <!-- ===== SEO ADDITIONS END ===== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
